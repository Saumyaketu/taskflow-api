name: TaskFlow CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, Lint & Automated Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tracker_db?schema=public"
      JWT_SECRET: "ci-pipeline-taskflow-jwt-secret-key-32-chars-minimum"
      JWT_EXPIRES_IN: "24h"
      BCRYPT_SALT_ROUNDS: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Static type-checking / Lint
        run: npm run lint

      - name: Build TypeScript distribution
        run: npm run build

      - name: Run full automated test suite
        run: npm test

      - name: Run mandatory rubric integration tests
        run: npm run test:integration

  docker-validation:
    name: Validate Docker & Compose Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker multi-stage build (dry-run)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: taskflow-api:ci-test
